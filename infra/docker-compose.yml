# Ferri's own Postgres (with pgvector). Switch runs its own Postgres on 5432,
# so this one listens on 5433. In production DATABASE_URL points at Supabase.
name: ferri
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ferri
      POSTGRES_PASSWORD: ferri
      POSTGRES_DB: ferri
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ferri-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferri -d ferri"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  ferri-pg:
