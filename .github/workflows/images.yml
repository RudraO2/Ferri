name: Images

# Publishes the two images the one-command stack pulls:
#   ghcr.io/<owner>/ferri               this repo (agent, Desk, setup and CLI), tags main and sha-<short>
#   ghcr.io/<owner>/ferri-switch-core   Switch's published core plus our fork's changes, pinned tag
# Both multi-arch (linux/amd64 and linux/arm64), so Apple Silicon and ARM servers pull native images.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      core:
        description: Also rebuild ferri-switch-core
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  # Switch release the fork is based on, and the fork commit that adds the agent message edit and WhatsApp.
  SWITCH_VERSION: 0.31.1-dev.339.g86d5928
  SWITCH_FORK: RudraO2/switch
  SWITCH_FORK_REF: a3d560e0f
  CORE_TAG: 0.31.1-dev.339.g86d5928-ferri.1

jobs:
  ferri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ferri
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  switch-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Skip when the pinned tag is already published
        id: check
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/ferri-switch-core:${CORE_TAG}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if [ "${{ inputs.core }}" != "true" ] && docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SWITCH_FORK }}
          ref: ${{ env.SWITCH_FORK_REF }}
          fetch-depth: 0
      - if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/ferri/Dockerfile
          build-args: BASE=ghcr.io/sandbox-quantum/dev/switch-core:${{ env.SWITCH_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.check.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Switch core with Ferri's fork changes (agent message edit, WhatsApp bridge)
            org.opencontainers.image.licenses=Apache-2.0 with Commons Clause
