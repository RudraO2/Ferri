name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, Desk build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desk:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  smoke:
    name: One-command stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GHCR (Ferri's Switch core image)
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Settings for CI (Haiku at low effort)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Add the ANTHROPIC_API_KEY repository secret"; exit 1; fi
          cat > .env <<EOF
          FERRI_MODEL_MAIN=claude-haiku-5-5
          FERRI_MODEL_FAST=claude-haiku-5-5
          FERRI_EFFORT_MAIN=low
          FERRI_EFFORT_FAST=low
          FERRI_ROOM_GRACE_SECONDS=5
          EOF
      - name: Switch core image (pull, else build from the fork)
        run: |
          val() { sed -n "s/^$1//p" "$2" | tr -d '\r'; }
          tag=$(val SWITCH_CORE_TAG= .env.example)
          image="ghcr.io/rudrao2/ferri-switch-core:$tag"
          if ! docker pull -q "$image"; then
            # The pinned fork commit, the same one ./ferri up builds from (SWITCH_FORK_REF).
            ref=$(val SWITCH_FORK_REF= .env.example)
            git init -q /tmp/switch && git -C /tmp/switch fetch -q --depth 1 https://github.com/RudraO2/switch.git "$ref" && git -C /tmp/switch checkout -q FETCH_HEAD
            docker build -q -f /tmp/switch/deploy/local/ferri/Dockerfile \
              --build-arg BASE=ghcr.io/sandbox-quantum/dev/switch-core:$(val SWITCH_VERSION= .env.example) \
              -t "$image" /tmp/switch
          fi
      - name: Build Ferri's image from this commit
        run: FERRI_BUILD=1 ./ferri build
      - name: ./ferri up
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep the image built from this commit; without it, up pulls the published main image over it.
          FERRI_BUILD: "1"
        run: ./ferri up
      - name: Ask Ferri through Mattermost
        run: ./ferri smoke
      - name: Doctor
        if: always()
        run: ./ferri doctor || true
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 ferri ferri-setup desk switch mattermost-setup
      - name: Stop
        if: always()
        run: docker compose --profile '*' down -v
